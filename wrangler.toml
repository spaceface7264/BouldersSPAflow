name = "bouldersspaflow"
compatibility_date = "2026-01-02"
# Vite output. Manual production deploys only (Cloudflare auto-deploy stays paused).
#   npm run deploy
pages_build_output_dir = "dist"

# Shared with dashboard.boulders.dk (boulders-dashboard Pages project).
[[d1_databases]]
binding = "SALES_DB"
database_name = "boulders-sales"
database_id = "da4055a2-e96b-4611-99a3-b4132d18ed72"

# Pages Functions live in ./functions (copied into dist by the Vite build plugin).
# No [assets] block: Pages rejects it. `npm run deploy:worker` passes --assets=./dist itself.

